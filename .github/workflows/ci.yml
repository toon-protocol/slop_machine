name: CI

# The repository gate, in the fleet's shape (relay's and store's ci.yml): one
# `build` job that runs the whole verification set, the shared no-op merge
# guard, and one aggregate `CI OK` check that is the single required context.
#
# It is also what makes the publish workflows safe to run on merge: there is
# one image-build job per published image, each building it exactly as its
# publish workflow builds it, so a Dockerfile that cannot build fails a PR
# instead of leaving `:release` silently pointing at the previous build.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite is not a unit suite: it boots the real origin, pushes real
      # RTMP at it, and lets a real ffmpeg encode the vibes, because ADR 0001
      # is a claim about bytes and only bytes can check it. So the runner needs
      # the encoder on PATH — `ffmpeg` and `ffprobe` come from the one apt
      # package, and `openssl` (which the ingest-TLS suites shell out to for a
      # throwaway certificate) is already on the GitHub image. Asserted rather
      # than assumed: a missing binary otherwise surfaces as a spawn error
      # deep inside a test.
      - name: Install the encoder the suite actually runs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          for tool in ffmpeg ffprobe openssl; do
            command -v "$tool" >/dev/null || {
              echo "::error::$tool is not on PATH — the suite cannot run without it"
              exit 1
            }
          done
          # `sed -n 1p`, not `head -1`: head closes the pipe after the first
          # line, and the SIGPIPE that gives the writer is a pipeline failure
          # under `pipefail`. sed reads the stream out.
          ffmpeg -version | sed -n 1p
          ffprobe -version | sed -n 1p
          openssl version

      # No `version:` input, deliberately: package.json's
      # `packageManager: pnpm@11.25.0` is the single place this repo's pnpm
      # version is written, and action-setup reads it. A second copy here
      # would be a version to drift, and action-setup fails outright when the
      # two disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The runtime the image runs (node:22-alpine), not the newest node.
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm format:check

      # Last because it is by far the slowest, and deliberately so — it
      # encodes. It also runs deploy/bundle.test.ts, the guard over the real
      # deploy artifacts, so the bundle's invariants are gated here too.
      - run: pnpm test

  # Fleet no-op merge guard (toon-meta#405), wired INTO this repo's aggregate
  # required check so that it blocks a HUMAN merge and not just the fleet
  # auto-merge pass (toon-meta#408): a red NON-required check is only a warning
  # on the merge button. No `secrets: inherit` — the guard makes no API call
  # and no write of any kind. No `if:` either: this workflow also runs on push,
  # where the guard passes with a plain "no merge result to evaluate"; a
  # job-level `if:` would make it `skipped` there, and a skipped gating job
  # must never read as a pass (toon-meta#279).
  no-op-merge:
    uses: toon-protocol/toon-meta/.github/workflows/empty-pr-guard.yml@main

  # The station origin image, built the way publish-station-origin-image.yml
  # builds it.
  #
  # It exists because that workflow only runs on push to main, so a Dockerfile
  # that cannot build would be discovered AFTER merge, with `:release` left
  # pointing at the previous build and every Watchtower box quietly not
  # updating. Not hypothetical: packages/station-origin/Dockerfile copies an
  # explicit file list rather than the whole package, so a new build-time file
  # at the package root breaks the image while every other gate stays green.
  #
  # Build only — no registry login, no push. Deliberately not a step of
  # `build`: it shares nothing with it and runs concurrently instead.
  image-build:
    name: Station origin image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # For `pnpm test:image` at the end of this job — the guard that an
      # operator's key material reaches neither the build context nor the
      # image. It is the one suite that needs a Docker daemon, which is why it
      # runs here rather than in `build`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the station origin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/station-origin/Dockerfile
          push: false
          load: true
          tags: station-origin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is the thing that ships, so assert what it reports rather
      # than trusting that a successful build implies a working one.
      - name: It reports the version package.json declares
        run: |
          set -euo pipefail
          EXPECTED=$(jq -r .version packages/station-origin/package.json)
          ACTUAL=$(docker run --rm --entrypoint node station-origin:ci \
            -e "import('/app/dist/index.js').then(m => process.stdout.write(m.VERSION))")
          echo "package.json=$EXPECTED image=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || {
            echo "::error::the image reports $ACTUAL but package.json declares $EXPECTED"
            exit 1
          }

      # The origin supervises a child ffmpeg, which is the whole reason this
      # image is bigger than a plain Node one. An image that builds but ships
      # no encoder starts fine and then fails at the first publish, on the
      # broadcaster's box rather than here.
      - name: It ships the encoder it supervises
        run: |
          set -euo pipefail
          # `sed -n 1p` rather than `head -1` — see the note on the encoder
          # install step above.
          docker run --rm --entrypoint ffmpeg station-origin:ci -version | sed -n 1p

      # deploy/image-secrets.test.ts (#27). It plants dummy key material where
      # deploy/README.md tells a broadcaster to generate the real thing, then
      # builds the whole build context into a probe image and the origin image
      # itself, and proves neither carries it. Deliberately outside `pnpm
      # test`: it needs this job's daemon, and it builds. The fast half of the
      # same guard — that .dockerignore still names the patterns — is in
      # deploy/bundle.test.ts and runs in `build` with everything else.
      - name: It carries no operator key material
        run: pnpm test:image

  # The slot app image, built the way publish-slot-app-image.yml builds it, and
  # for the same reason `image-build` exists: that workflow only runs on push
  # to main, so a Dockerfile that cannot build would be discovered AFTER merge
  # with `:release` left pointing at the previous build. Its own COPY list is
  # explicit too, so a new build-time file at the package root breaks the image
  # while every other gate stays green.
  #
  # A separate job rather than a step of `image-build`: it shares nothing with
  # the origin's image and runs concurrently instead. Build only — no registry
  # login, no push. The key-material guard (`pnpm test:image`) covers both
  # images and runs in `image-build`, which is the job that already has the
  # planting and the daemon.
  slot-app-image-build:
    name: Slot app image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the slot app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/slot-app/Dockerfile
          push: false
          load: true
          tags: slot-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is the thing that ships, so assert what it reports rather
      # than trusting that a successful build implies a working one.
      - name: It reports the version package.json declares
        run: |
          set -euo pipefail
          EXPECTED=$(jq -r .version packages/slot-app/package.json)
          ACTUAL=$(docker run --rm --entrypoint node slot-app:ci \
            -e "import('/app/dist/index.js').then(m => process.stdout.write(m.VERSION))")
          echo "package.json=$EXPECTED image=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || {
            echo "::error::the image reports $ACTUAL but package.json declares $EXPECTED"
            exit 1
          }

      # The bundled entrypoint has to RUN inside the image, not merely be in
      # it. Both operator credentials are mounted files with no default, so the
      # app refuses to start without them — which is exactly what makes this a
      # usable smoke test: a refusal naming the missing credential proves the
      # bundle loaded, and a stack trace or a silent start does not.
      - name: Its bundled entrypoint runs, and refuses without its credentials
        run: |
          set -euo pipefail
          REFUSAL=$(docker run --rm slot-app:ci 2>&1 || true)
          echo "$REFUSAL"
          case "$REFUSAL" in
            *OperatorCredentialError*TOON_OPERATOR_WRITE_KEY_FILE*) ;;
            *)
              echo "::error::the image did not refuse to start naming the missing operator write key"
              exit 1
              ;;
          esac

      # And with both mounted — and an operator surface named, which is
      # required for the same reason and has no default — it comes up and
      # answers liveness, unpriced, with no payment header sent and none
      # required. Nothing here dials that URL: liveness makes no operator
      # write, and the hub's connector is not part of this job.
      - name: It answers liveness with both credentials mounted
        run: |
          set -euo pipefail
          SECRETS=$(mktemp -d)
          openssl rand -hex 32 > "$SECRETS/operator-signing.key"
          openssl rand -hex 32 > "$SECRETS/operator-bearer.token"
          # The image runs unprivileged as `node`, and `mktemp -d` is 0700 —
          # without this the container cannot traverse the mount and the
          # refusal we would see is the one about an unreadable file.
          chmod 755 "$SECRETS"
          chmod 644 "$SECRETS/operator-signing.key" "$SECRETS/operator-bearer.token"
          docker run -d --name slot-app-ci \
            -v "$SECRETS:/run/secrets:ro" \
            -e TOON_OPERATOR_WRITE_KEY_FILE=/run/secrets/operator-signing.key \
            -e TOON_OPERATOR_BEARER_TOKEN_FILE=/run/secrets/operator-bearer.token \
            -e TOON_OPERATOR_URL=http://connector:3000 \
            -p 127.0.0.1:3200:3200 slot-app:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3200/health > /tmp/health.json; then break; fi
            sleep 1
          done
          docker logs slot-app-ci
          docker rm -f slot-app-ci > /dev/null
          rm -rf "$SECRETS"
          cat /tmp/health.json
          jq -e '.status == "healthy" and .service == "slot-app"' /tmp/health.json

  # The devnet (slop_machine#56). `pnpm test:devnet` brings a chain up, replays
  # the settlement contracts onto it and — as the epic lands — drives the whole
  # documented path across a hub and a station, ending with a broadcaster
  # holding money.
  #
  # GATED FROM THE START, and added to `ci-ok`'s `needs:` in the same commit
  # that adds it: every devnet slice after this one is then watched as it
  # lands rather than the whole thing arriving unwatched, and a job this repo
  # adds and does not gate on is a job that can go red unnoticed.
  #
  # Its own job rather than a step of `build`, for the same reason the two
  # image builds are: it needs a Docker daemon, it shares nothing with the
  # ordinary suite, and it runs concurrently instead of adding minutes to the
  # gate everybody waits on. The runner ships the daemon and compose; the
  # devnet needs no Foundry, no Rust and no submodules, which is the whole
  # point of replaying the contracts with viem.
  devnet:
    name: The devnet runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The run tears itself down, volumes included, whether it passes or
      # fails — and a failure prints every node's logs before it does, so a red
      # job here is diagnosable without re-running it locally.
      - run: pnpm test:devnet

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [build, no-op-merge, image-build, slot-app-image-build, devnet]
    if: always()
    steps:
      # Fleet-wide aggregate required check (toon-meta#279): this job is the
      # single required status for the repo. It runs even when upstream jobs
      # fail, are cancelled, or are skipped (`if: always()`), and passes ONLY
      # when every gating job reports result == 'success' — a skipped or
      # cancelled gating job must never read as a pass. No job above carries
      # an `if:` of its own, so there is no legitimately-skippable one.
      - name: Verify all gating jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Gating job results:"
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          FAILED=$(echo "$RESULTS" | jq -r '
            to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$FAILED" ]; then
            echo "::error::Gating jobs did not succeed: $(echo "$FAILED" | tr '\n' ' ')"
            exit 1
          fi
          echo "All gating jobs succeeded."
