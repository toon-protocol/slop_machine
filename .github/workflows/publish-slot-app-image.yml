name: Publish slot app image

# Builds the slot app image (packages/slot-app/Dockerfile) and pushes it to
# GHCR as ghcr.io/toon-protocol/slot-app. Same shape as
# publish-station-origin-image.yml beside it, and as relay's and store's — one
# publish workflow per app image, no fleet-specific machinery of its own.
#
# This repository publishes exactly two images, both of them apps from
# `packages/`: the station origin and this one. It publishes NO CONNECTOR — the
# connector is the stock GHCR image on an immutable pin
# (deploy/docker-compose.yml's `connector.image`, the pin of record), and
# deploy/bundle.test.ts fails the build if that ever changes.
#
# `latest` is (re)published on every push to main; version tags (vX.Y.Z) also
# publish semver tags for pinning, plus an immutable sha tag.
#
# `release` is this image's instance of the fleet-wide moving-tag convention
# (toon-meta#403, relay and store run the same one): a box runs a label-scoped
# Watchtower that watches `:release` rather than `:latest`, so an auto-redeploy
# only ever follows a commit that landed on main and built here. The immutable
# `:sha-*` tag stays as the pinning/rollback handle.
#
# A recreate of the slot app is not the outage a recreate of a station origin
# is — it drops no broadcaster's publish, and the peerings and routes it wrote
# are the connector's, not this process's. It is a few seconds in which a
# broadcaster's purchase would not be answered.
#
# ci.yml builds this same image on every PR (`slot-app-image-build`) but pushes
# nothing, so a Dockerfile that cannot build is caught BEFORE merge rather than
# leaving `:release` silently pointing at the previous build.
#
# Single-arch (amd64, the runner's own): the devnet boxes are x86, and no
# consumer of this image asks for arm64.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency: publish-slot-app-image-${{ github.ref }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The repository default for GITHUB_TOKEN is read-only, so this block is
      # what makes the push possible at all — dropping it is a 403 on push.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/slot-app
          # `latest` and `release` both track main (release is the Watchtower
          # watch target, see the header above); semver tags publish on vX.Y.Z;
          # sha tags give an immutable handle. `enable={{is_default_branch}}`
          # keeps the two moving tags off tag and manual runs from anywhere but
          # main.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=release,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repository root, not the package
          # directory: the Dockerfile's first COPY takes the workspace root's
          # package.json, pnpm-workspace.yaml, pnpm-lock.yaml and
          # tsconfig.json, which is how the frozen install resolves.
          context: .
          file: packages/slot-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
