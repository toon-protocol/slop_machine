<!doctype html>
<!-- PROTOTYPE Slop: portrait, swipe-driven. Deliberately uses vertical swipes (up = jump) to collide with a Feed swipe gesture. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Swipe Dodge</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f172a; overflow: hidden; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script>
      const cv = document.querySelector('canvas');
      const g = cv.getContext('2d');
      const fit = () => ((cv.width = innerWidth * devicePixelRatio), (cv.height = innerHeight * devicePixelRatio));
      fit();
      addEventListener('resize', fit);

      const t0 = Date.now();
      let lane = 1, jumpUntil = 0, obs = [], score = 0, best = 0, flash = 0, spawn = 0, last = performance.now();
      const move = (d) => (lane = Math.max(0, Math.min(2, lane + d)));
      const jump = () => (jumpUntil = performance.now() + 650);

      // Touch events with preventDefault, so the browser never claims the swipe; fires as soon as the swipe is clear.
      let sx = null, sy = null;
      const down = (x, y) => ((sx = x), (sy = y));
      const drag = (x, y) => {
        if (sx === null) return;
        const dx = x - sx, dy = y - sy;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 25) (move(Math.sign(dx)), (sx = null));
        else if (dy < -25) (jump(), (sx = null));
      };
      const t = (e) => e.changedTouches[0];
      addEventListener('touchstart', (e) => (e.preventDefault(), down(t(e).clientX, t(e).clientY)), { passive: false });
      addEventListener('touchmove', (e) => (e.preventDefault(), drag(t(e).clientX, t(e).clientY)), { passive: false });
      addEventListener('touchend', () => (sx = null));
      addEventListener('mousedown', (e) => down(e.clientX, e.clientY));
      addEventListener('mousemove', (e) => drag(e.clientX, e.clientY));
      addEventListener('mouseup', () => (sx = null));
      addEventListener('keydown', (e) => {
        if (e.key === 'a') move(-1);
        if (e.key === 'd') move(1);
        if (e.key === 'w') jump();
      });

      function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        spawn -= dt;
        if (spawn <= 0) (obs.push({ lane: Math.floor(Math.random() * 3), y: -0.1 }), (spawn = 0.6 + Math.random() * 0.5));
        const speed = 0.45 + score * 0.004;
        const jumping = now < jumpUntil;
        for (const o of obs) {
          o.y += speed * dt;
          if (!o.done && o.lane === lane && Math.abs(o.y - 0.82) < 0.04 && !jumping) ((o.done = true), (o.hit = true), (score = 0), (flash = 0.3));
          if (!o.done && o.y > 0.88) ((o.done = true), score++, (best = Math.max(best, score)));
        }
        obs = obs.filter((o) => o.y < 1.1 && !o.hit);
        flash = Math.max(0, flash - dt);

        const W = cv.width, H = cv.height, lw = W / 3, dpr = devicePixelRatio;
        g.fillStyle = flash ? '#7f1d1d' : '#0f172a';
        g.fillRect(0, 0, W, H);
        g.strokeStyle = '#ffffff22';
        g.lineWidth = 2 * dpr;
        for (let i = 1; i < 3; i++) (g.beginPath(), g.moveTo(i * lw, 0), g.lineTo(i * lw, H), g.stroke());
        g.fillStyle = '#f59e0b';
        for (const o of obs) g.fillRect(o.lane * lw + lw * 0.2, o.y * H - 14 * dpr, lw * 0.6, 28 * dpr);
        g.fillStyle = '#38bdf8';
        g.beginPath();
        g.arc(lane * lw + lw / 2, 0.82 * H - (jumping ? 30 * dpr : 0), (jumping ? 26 : 20) * dpr, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#fff';
        g.textAlign = 'center';
        g.font = `800 ${36 * dpr}px system-ui`;
        g.fillText(score, W / 2, 110 * dpr);
        g.font = `${13 * dpr}px system-ui`;
        g.fillText(`best ${best} · swipe ←→ to dodge, ↑ to jump`, W / 2, 136 * dpr);
        g.textAlign = 'left';
        g.globalAlpha = 0.6;
        g.fillText(`alive ${Math.round((Date.now() - t0) / 1000)}s`, 8 * dpr, H - 10 * dpr);
        g.globalAlpha = 1;
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
