<!doctype html>
<!-- PROTOTYPE Slop: audio unlock test. Shows whether Web Audio and <audio> can start from the input this Slop receives. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Beep Test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #064e3b; color: #fff; font: 15px system-ui; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box; }
      #big { font-size: 96px; }
      #status { font: 13px/1.5 ui-monospace, monospace; background: #0006; border-radius: 8px; padding: 8px 12px; white-space: pre; }
      #log { font: 11px/1.4 ui-monospace, monospace; opacity: 0.8; white-space: pre; max-height: 30vh; overflow: hidden; }
    </style>
    <script src="/_shim.js"></script>
  </head>
  <body>
    <div id="big">🔇</div>
    <div>tap anywhere to beep</div>
    <div id="status"></div>
    <div id="log"></div>
    <script>
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      // 0.15 s 880 Hz WAV, for the <audio> element path.
      const wav = (() => {
        const rate = 8000, n = rate * 0.15, b = new DataView(new ArrayBuffer(44 + n));
        const s = (o, str) => [...str].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
        s(0, 'RIFF'); b.setUint32(4, 36 + n, true); s(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
        b.setUint32(24, rate, true); b.setUint32(28, rate, true); b.setUint16(32, 1, true); b.setUint16(34, 8, true); s(36, 'data'); b.setUint32(40, n, true);
        for (let i = 0; i < n; i++) b.setUint8(44 + i, 128 + 60 * Math.sin((2 * Math.PI * 880 * i) / rate));
        return URL.createObjectURL(new Blob([b.buffer], { type: 'audio/wav' }));
      })();
      const el = new Audio(wav);
      let elResult = 'not tried', beeps = 0;
      const lines = [];
      const log = (m) => (lines.unshift(m), (lines.length = Math.min(lines.length, 8)), (document.getElementById('log').textContent = lines.join('\n')));

      function beep() {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 660;
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.2);
        beeps++;
      }
      function onInput(e) {
        log(`${e.type} isTrusted=${e.isTrusted}`);
        ctx.resume().then(() => ctx.state === 'running' && beep());
        el.currentTime = 0;
        el.play().then(() => (elResult = 'played'), (err) => (elResult = `blocked (${err.name})`));
      }
      addEventListener('pointerdown', onInput);
      addEventListener('touchstart', onInput);

      ctx.resume();
      let lastStatus = '';
      setInterval(() => {
        const ua = navigator.userActivation;
        document.getElementById('big').textContent = ctx.state === 'running' ? '🔊' : '🔇';
        const status = (document.getElementById('status').textContent = [
          `WebAudio   ${ctx.state}   beeps ${beeps}`,
          `<audio>    ${elResult}`,
          `activation ${ua ? `isActive=${ua.isActive} hasBeenActive=${ua.hasBeenActive}` : 'API missing (iOS)'}`,
        ].join('\n'));
        if (status !== lastStatus) console.log(`[beep] ${(lastStatus = status).replace(/\n/g, ' | ')}`); // readable without touching the frame
      }, 250);
    </script>
  </body>
</html>
