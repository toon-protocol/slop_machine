# =============================================================================
# The connector in front of this station — the payment proxy.
# =============================================================================
# Mounted read-only into the stock connector image at
# /app/config/connector.toml (see ./docker-compose.yml), which is also where
# that image's build is pinned — so the build and the config it was validated
# against live at one commit and reach a box in one `git pull`.
#
# THIS FILE IS WHERE A STATION'S PRICES LIVE. Pricing a route is connector
# config, never application code: the origin behind this proxy has no notion
# of a payment at all, and every request that reaches it is already proven
# paid. The numbers below are the placeholder ladder from
# ../docs/placeholder-numbers.md.
#
# Three things to know before editing:
#   1. There is NO environment-variable layer. Every value comes from this
#      file. The only variable the binary reads is RUST_LOG.
#   2. Every table is `deny_unknown_fields`. An unrecognised key — a typo, or
#      one from an older connector — is a load failure that names it.
#   3. Startup is FAIL-CLOSED. A missing key file, an unwritable state_dir, or
#      a settlement chain it cannot reach is `exit 1` with the reason, never a
#      degraded run.
#
# To run your own station, change [node] to your own ILP apex and hostname and
# the prices to yours; everything else can stay as it is.
#
# `g.toon.slopmachine.demo` throughout is a PLACEHOLDER, and the handle in it
# IS NOT YOURS TO PICK. A hub grants `<its apex>.<a handle derived from the
# payer key you buy your slot with>`, the same one every time you come back.
# PULL A QUOTE FROM YOUR HUB FIRST — it is a floor-priced address whose whole
# job is telling you the prefix you would be granted — then replace all five
# occurrences AND the five entries in [node].addresses with it, and only then
# bring the station up. A station still saying `demo` publishes nothing beneath
# the prefix its hub granted, so the hub's forwarded routes and this file's
# terminations name different prefixes and every packet the hub carries arrives
# somewhere this connector does not terminate. See ./README.md step 3.
# =============================================================================

# The one listener. POST /ilp, GET /ilp (self-description), GET /ilp/btp,
# GET /ilp/identity and the operator surface all share it — there is no
# separate admin or health port. 0.0.0.0 so the compose network reaches it;
# the port is published to 127.0.0.1 only, never to the internet (see
# docker-compose.yml's ports invariant).
client_edge_addr = "0.0.0.0:3000"

# Durable claim state, on a named volume.
#
# The append-only claim journals live here, and replaying them is what makes a
# channel's replay watermark survive a restart. Without a volume, every
# watermark resets on restart, a channel with no watermark accepts any nonce,
# and every claim a viber already spent buys another segment.
state_dir = "/app/state"

# ── Identity ─────────────────────────────────────────────────────────────────
# A LOCATION, never the key itself: 64 hex characters holding a secp256k1
# secret key. This is the connector's own ILP signing identity — it holds no
# money, so it is fresh random material per box:
#
#   openssl rand -hex 32 > signer.key
#   chmod 600 signer.key && sudo chown 10001:10001 signer.key
#
# A bind-mounted file keeps its HOST ownership inside the container, so a
# root-owned key is unreadable to uid 10001 and the container restart-loops on
# "Permission denied". The chown is the fix; `chmod 644` is not.
[signer]
key_file = "/app/data/signer.key"

# ── What this station says about itself ──────────────────────────────────────
# The facts a node cannot introspect: from inside a container it sees
# 0.0.0.0:3000 and a private network, never its own public name. They are
# served, free and unauthenticated, on `GET /ilp` — a stranger with this URL
# needs nothing else to transact with it.
#
# `addresses` lists every prefix this station terminates, which is exactly the
# five routes below: one per rung on the ladder the origin is running, plus
# the station's *now*. A prefix terminated but never advertised is an address
# no viber can discover; a rung advertised but not terminated is a paid 404.
#
# Note what is NOT here: no playlist, no rung list, no price list. A viber
# learns a station's rungs and their prices from the ANNOUNCEMENT the hub's
# relay carries, not from the origin — discovery is the announcement's job.
#
# Replace `demo` and the hostname with your own.
[node]
addresses = [
  "g.toon.slopmachine.demo.now",
  "g.toon.slopmachine.demo.audio",
  "g.toon.slopmachine.demo.480p",
  "g.toon.slopmachine.demo.720p",
  "g.toon.slopmachine.demo.1080p",
]
http_endpoint = "https://station.demo.example.com/ilp"
btp_endpoint = "wss://station.demo.example.com/ilp/btp"

# ── The station's *now* ──────────────────────────────────────────────────────
# Where the live edge is: every rung's current sequence number, the fixed
# segment duration, and whether ingest is live. This is what a viber pulls to
# start at the live edge instead of at the beginning, and to re-sync after a
# gap.
#
# ITS OWN ROUTE AT ITS OWN LOW PRICE. `/now` sits outside `/segments`
# entirely and beneath no rung, so it can be priced on its own: a viber
# re-syncing must not be charged a segment's price, and no segment may ever be
# reachable at this address's price. 50 is a floor price, not a per-byte one —
# a quarter of the cheapest rung, so re-syncing is never a meaningful fraction
# of watching. Non-zero, which is also what keeps the x402 greeting armed;
# nothing free is served from a station node.
[[routes]]
prefix = "g.toon.slopmachine.demo.now"
handler_url = "http://origin:3100/now"
price = 50

# ── One route per rung, at that rung's price ─────────────────────────────────
#
# The whole of ADR 0002 in five stanzas: a rung IS an address, so choosing a
# rung is choosing a price and a viber's budget steers quality. A player
# climbs and drops rungs mid-broadcast by pulling a different prefix.
#
# THE HANDLER URL IS THE DISCIPLINE. Each route terminates at
# `/segments/<rung>`, and the origin serves that rung's segments strictly
# beneath it at `/segments/<rung>/<sequence>.ts`. An envelope's target
# resolves under the route's own handler path and can never replace any part
# of it (connector ADR 0025), so a packet paying the `audio` price can reach
# audio segments and nothing else — not another rung, not `/now`, and not
# `/health` or `/encode`, which sit outside `/segments` entirely and have NO
# ROUTE HERE AT ALL: they are in-node diagnostics, and the only reason
# unpriced does not mean free to the internet is that the segment port is
# published on no interface. That is the same discipline relay's `/write`
# route uses. Never point a route at the bare origin, and never at
# `/segments`: either one would make every rung reachable at one rung's price,
# and the bare origin would put `/health` and `/encode` on sale.
#
# `per_kib` IS NEVER SET ON A STATION ROUTE. Every price here is flat per
# segment and the slope is always zero. A price is a schedule over the
# INBOUND payload, and a viber's request for a segment is a few hundred bytes
# while the vibes are in the fulfill — so charging per KiB would bill the
# request and silently do nothing for the megabyte it returns. It is exactly
# the "fix" a future reader will attempt, expecting bigger segments to cost
# more, and deploy/bundle.test.ts (slop_machine#14) fails the build for it.
# Bitrate is priced by ADDRESS instead, which is what these five routes are
# for. See ADR 0002.
#
# Prices are in the settlement token's smallest unit — 6-decimal USDC, so
# `1000` is 0.001 USDC. At four-second segments that is fifteen segments a
# minute, so a per-segment price times 15 is a per-minute rate. They are
# roughly proportional to bitrate, because bandwidth is what a rung costs a
# broadcaster. Placeholders, not decisions: see ../docs/placeholder-numbers.md.

# Sound only, no picture at all — which is what makes it the cheap rung, and
# the one a viber on a thin budget or a bad connection falls back to.
[[routes]]
prefix = "g.toon.slopmachine.demo.audio"
handler_url = "http://origin:3100/segments/audio"
price = 200

[[routes]]
prefix = "g.toon.slopmachine.demo.480p"
handler_url = "http://origin:3100/segments/480p"
price = 1000

[[routes]]
prefix = "g.toon.slopmachine.demo.720p"
handler_url = "http://origin:3100/segments/720p"
price = 2000

# The top rung sits at 3 Mbit/s, not at the 4.19 Mbit/s ceiling four-second
# segments allow, to leave headroom for VBR overshoot. Do not add a rung above
# it without re-reading ADR 0001 — and if you do add one, it needs a route
# here or it is unsellable.
[[routes]]
prefix = "g.toon.slopmachine.demo.1080p"
handler_url = "http://origin:3100/segments/1080p"
price = 3500

# No `transport` on any route above, deliberately — so both client transports
# are accepted. A client daemon watching for an hour amortizes a BTP session's
# handshake and claim round trip, but a viber sampling a station they just
# found should not need one, and sampling is how a station gets an audience.
# Transport is per-connector policy, not a protocol constant.

# ── Getting paid ─────────────────────────────────────────────────────────────
# With this section, anyone who opens a channel on chain can pay this station
# with no config edit, and the accepted claim's watermark is journaled under
# state_dir. Without it, this node has a record of no channel and refuses
# every claim at its edge as unknown.
#
# THE BROADCASTER IS THE OPERATOR. The settlement key below is theirs, the
# channel a viber opens is against them, and vibers' payments accrue to them
# directly. Nobody collects on a broadcaster's behalf and nobody owes them a
# payout.
#
# Fail-closed at STARTUP: the connector resolves token_address through the
# registry at contract_address and reads the token's own decimals(). A wrong
# RPC, a registry that does not answer, or a decimals mismatch is exit 1
# before it serves anything. Every chain below is one more endpoint this node
# must reach before it will boot.
#
# These values are the shared TOON devnet's deployment — the same registry,
# token and decimals the rest of the fleet settles through. Point them
# elsewhere only if you are running your own fleet end to end.
[settlement.evm]
rpc_url = "https://base-sepolia-rpc.publicnode.com"
contract_address = "0x0c41D9D424d6B075A3cEa1068a694f7847a8CCa5"
token_address = "0x49beE1Bca5d15Fb0963117923403F9498119a9Ce"
decimals = 6

# Deliberately NOT the [signer] key above. That one is per-box random material
# with no funds; this one is the identity vibers open their channels AGAINST,
# so provision it from a seed you can reproduce, not from `openssl rand`. The
# TOON fleet derives it at NIP-06 m/44'/1237'/0'/0/0 — the NOSTR coin type,
# not the standard m/44'/60'. Deriving at m/44'/60' yields a valid address no
# channel was ever opened against; verify the derived address BEFORE the first
# `up -d`.
[settlement.evm.key]
key_file = "/app/data/settlement.key"

# A node that accepts claims is a counterparty on whichever chain the VIBER
# chose, so an EVM-only station refuses every Solana-paid pull that reaches
# it. Drop these two tables (and the key mount in docker-compose.yml) to run
# EVM-only.
[settlement.solana]
rpc_url = "https://api.devnet.solana.com"
program_id = "2aEVJ8koKD8LTZrLRSGtAtU7LBt4e7QjjCgf1kzQ7Rip"
token_address = "34eSxY7qxQ4GzyhDJ8GpUcTz1WWzruGbJbR8q6TtxfQU"
decimals = 6

[settlement.solana.key]
# A 32-byte ed25519 seed as 64 hex characters; the fleet derives it from the
# same mnemonic at m/44'/501'/0'/0'.
key_file = "/app/data/settlement-solana.key"

# ── The operator surface ─────────────────────────────────────────────────────
# Every read (peers, routes, channels, claims, /metrics) needs the bearer
# token; every write — `POST /peers` to establish the peering with the hub
# that a bought slot entitles this station to (ADR 0003, connector ADR 0058),
# `POST /routes/peers`, `POST /channels/:id/fund` — needs an RFC 9421
# signature from a key on the allowlist. Both are credentials, and this file
# is committed to a PUBLIC repository, so only the two file-valued forms are
# used here: the values live in files the compose file mounts beside the keys,
# never in this config. A section naming a file that is missing or empty is a
# refuse-to-start, never a silently open surface.
#
# TWO NAMES THAT LOOK ALIKE AND ARE NOT THE SAME THING:
#
#   operator-write.keys   the ALLOWLIST, mounted below. Public halves, one
#     (plural)            keyid per line, hand-edited to grant or REVOKE
#                         authority. Not secret; per box.
#   operator-signing.key  the PRIVATE ed25519 seed the writes are signed with.
#     (singular, and      On a station it does not live on this box at all —
#      not "write")       you keep it wherever you sign from. It is called
#                         `signing` rather than `write` so it is never one
#                         character away from the file above; on a hub the two
#                         DO share a directory (deploy/hub/), and one of them
#                         is a secret while the other is something you edit by
#                         hand.
#
#   openssl rand -hex 32 > operator-bearer.token
#   openssl rand -hex 32 > operator-signing.key      # the PRIVATE half
#   connector send --operator-key operator-signing.key --print-keyid \
#     > operator-write.keys                          # the PUBLIC half: the
#                                                    # allowlist, one per line
#   chmod 600 operator-bearer.token operator-signing.key
#   sudo chown 10001:10001 operator-bearer.token operator-write.keys
#
# Revoke a key by deleting its line from operator-write.keys and restarting.
[operator]
bearer_token_file = "/app/data/operator-bearer.token"
write_keys_file   = "/app/data/operator-write.keys"
